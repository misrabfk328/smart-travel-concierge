name: VoyagerAI AgentOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Deterministic Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12 and sync dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --extra eval --extra lint

      - name: Run Ruff lint and format checks
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests

      - name: Run type check and spell check
        run: |
          uv run ty check
          uv run codespell app tests README.md

      - name: Run unit, offline integration, and golden schema tests
        run: uv run pytest tests/unit tests/integration/test_concierge_e2e.py -v

  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Check formatting and validate Terraform configs
        working-directory: deployment/terraform/single-project
        run: |
          terraform fmt -check -recursive ..
          terraform init -backend=false
          terraform validate
